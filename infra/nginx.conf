# HTTP → HTTPS
server {
    listen 80;
    server_name pydep.ru www.pydep.ru _;
    return 301 https://pydep.ru$request_uri;
}

# www → apex (HTTPS)
server {
    listen 443 ssl http2;
    server_name www.pydep.ru;

    ssl_certificate     /etc/certs/cert.crt;
    ssl_certificate_key /etc/certs/cert.key;

    return 301 https://pydep.ru$request_uri;
}

# основной сайт (HTTPS)
server {
    listen 443 ssl http2 default_server;
    server_name pydep.ru _;

    ssl_certificate     /etc/certs/cert.crt;
    ssl_certificate_key /etc/certs/cert.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    error_page 502 503 504 /503.html;

    location = /503.html {
        alias /etc/templates/index.html;
        internal;
        default_type text/html;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
    }

    location /static/ {
        root /var/html/;
    }

    location /media/ {
        root /var/html/;
    }

    location / {
        if (-f /etc/templates/enabled) {
            return 503;
        }

        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
