# home.server — Split DNS через Tailscale
# Установка: sudo cp infra/macos/home.server.conf /opt/homebrew/etc/dnsmasq.d/
# Замените 100.112.169.81 на Tailscale IP этого Mac (tailscale ip -4).

bind-dynamic
listen-address=127.0.0.1,100.112.169.81
no-resolv

address=/macbook.home.server/100.112.169.81
address=/pydep.home.server/100.112.169.81

local=/home.server/
domain=home.server
