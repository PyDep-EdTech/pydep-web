server {
    listen 80;
    server_name pydep.ru;

    # Ручной режим техработ:
    #   touch infra/nginx/maintenance.on && docker compose exec nginx nginx -s reload
    # Выключить:
    #   rm infra/nginx/maintenance.on && docker compose exec nginx nginx -s reload
    set $maintenance 0;
    if (-f /etc/nginx/maintenance-flag/maintenance.on) {
        set $maintenance 1;
    }

    location /static/ {
        root /var/html/;
    }

    location /media/ {
        root /var/html/;
    }

    # Статическая страница (доступна и напрямую: /maintenance.html)
    location = /maintenance.html {
        root /var/html/;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
        add_header Retry-After "3600" always;
    }

    location / {
        if ($maintenance = 1) {
            return 503;
        }

        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
    }

    # Без «=»: сохраняем исходный код ответа (502/503/504)
    error_page 502 503 504 /maintenance.html;
}
