# Nginx на ХОСТЕ (systemctl) — та же схема, что docker-nginx + web:
#   web:  collectstatic → /app/staticfiles
#   host: /var/www/pydep/static  (bind mount)
#   nginx: location /static/ → /var/www/pydep/static/
#
# cp infra/nginx/pydep-host.conf /etc/nginx/sites-available/pydep
# ln -sf /etc/nginx/sites-available/pydep /etc/nginx/sites-enabled/pydep
# rm -f /etc/nginx/sites-enabled/default
# nginx -t && systemctl reload nginx
#
# docker compose stop nginx   ← если nginx на systemctl

server {
    listen 80;
    server_name pydep.ru www.pydep.ru;
    return 301 https://pydep.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.pydep.ru;

    ssl_certificate     /etc/letsencrypt/live/pydep.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pydep.ru/privkey.pem;

    return 301 https://pydep.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pydep.ru;

    ssl_certificate     /etc/letsencrypt/live/pydep.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pydep.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    error_page 502 503 504 /503.html;

    location = /503.html {
        alias /etc/templates/index.html;
        internal;
        default_type text/html;
    }

    # Как в docker-nginx: root /var/html/ + uri /static/ → /var/html/static/...
    # На хосте то же самое через alias:
    location /static/ {
        alias /var/www/pydep/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/pydep/media/;
        expires 7d;
        access_log off;
    }

    location / {
        if (-f /etc/templates/enabled) {
            return 503;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
