{% extends 'base.html' %}
{% load static %}

{% block title %}Доступ закрыт — PyDep{% endblock %}

{% block content %}
<div class="container">
    <div class="text-center d-flex flex-column align-items-center justify-content-center" style="min-height: calc(100vh - 200px); padding: 60px 0;">
        <div style="width:96px;height:96px;border-radius:28px;display:grid;place-items:center;font-size:2.6rem;color:#fff;background:var(--grad-brand);box-shadow:0 16px 40px -12px rgba(255, 176, 32,.7);margin-bottom:28px;">
            <i class="bi bi-shield-lock"></i>
        </div>
        <div class="text-gradient" style="font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(3rem,8vw,5rem);font-weight:700;line-height:1;">403</div>
        <h1 class="mt-3 mb-2">Доступ закрыт</h1>
        <p class="text-muted mb-4" style="max-width:460px;">
            У вас нет прав для просмотра этой страницы. Возможно, нужно войти в аккаунт
            или записаться на курс.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-3">
            <a href="{% url 'lesson:index' %}" class="btn btn-primary"><i class="bi bi-house me-2"></i>На главную</a>
            <a href="{% url 'lesson:courses' %}" class="btn btn-ghost">К курсам</a>
        </div>
    </div>
</div>
{% endblock %}
