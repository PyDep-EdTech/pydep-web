{% if form.errors %}
<div class="alert alert-danger mb-3">
    <strong>Не удалось сохранить.</strong>
    <ul class="mb-0 mt-2">
        {% for field in form %}
            {% for error in field.errors %}
            <li>{{ field.label }}: {{ error }}</li>
            {% endfor %}
        {% endfor %}
        {% for error in form.non_field_errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}
