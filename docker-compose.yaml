version: '3.8'

services:
  db:
    image: postgres:13.0-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
  web:
    build: .
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # collectstatic → /app/staticfiles → на хосте /var/www/pydep/static
      # (как раньше общий volume между web и nginx, только через bind mount)
      - /var/www/pydep/static:/app/staticfiles
      - /var/www/pydep/media:/app/media
    depends_on:
      - db
    env_file:
      - ./.env
  # Nginx в Docker — опционально. Если nginx через systemctl: docker compose stop nginx
  nginx:
    image: nginx:1.21.3-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/templates:/etc/templates:ro
      - /var/www/pydep/static:/var/html/static:ro
      - /var/www/pydep/media:/var/html/media:ro
      - /root/pydep/infra/certs:/etc/certs:ro
    depends_on:
      - web

volumes:
  postgres_data:
